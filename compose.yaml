name: org-calendar
x-nextcloud: &nextcloud
  image: ${NEXTCLOUD_IMAGE:-nextcloud:34-apache}
  restart: unless-stopped
  environment: &nc-env
    POSTGRES_HOST: db
    POSTGRES_DB: calendar
    POSTGRES_USER: calendar
    POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    NEXTCLOUD_ADMIN_USER: calendar-admin
    NEXTCLOUD_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    NEXTCLOUD_TRUSTED_DOMAINS: ${CALENDAR_HOST:?Run scripts/init.py first}
    OVERWRITEHOST: ${CALENDAR_HOST}
    OVERWRITEPROTOCOL: https
    OVERWRITECLIURL: https://${CALENDAR_HOST}
    TRUSTED_PROXIES: ${PROXY_IP:-172.29.88.10}
    REDIS_HOST: redis
    PHP_MEMORY_LIMIT: 512M
    PHP_UPLOAD_LIMIT: 32M
    TZ: Europe/Athens
    LDAPTLS_CACERT: /etc/calendar-certs/ad-ca.crt
    LDAPTLS_REQCERT: demand
  volumes:
    - nextcloud:/var/www/html
    - ./certs:/etc/calendar-certs:ro
  secrets:
    - db_password
    - admin_password
  networks: [backend]
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: calendar
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U calendar -d calendar]
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    command: [redis-server, --save, '', --appendonly, 'no']
    networks: [backend]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 12
  app:
    <<: *nextcloud
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, php, -r, "$$s=json_decode(file_get_contents('http://localhost/status.php'),true); exit(!($$s['installed'] ?? false));"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 20
  cron:
    <<: *nextcloud
    entrypoint: /cron.sh
    depends_on:
      app: {condition: service_healthy}
  proxy:
    image: ${NGINX_IMAGE:-nginx:1.28-alpine}
    restart: unless-stopped
    ports:
      - '${BIND_IP:-0.0.0.0}:443:443'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/calendar-certs:ro
    networks:
      backend:
        ipv4_address: ${PROXY_IP:-172.29.88.10}
    depends_on:
      app: {condition: service_healthy}
secrets:
  db_password:
    file: ./secrets/db_password
  admin_password:
    file: ./secrets/admin_password
volumes:
  nextcloud:
  postgres:
networks:
  backend:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.29.88.0/24}
