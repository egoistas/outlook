name: custom-org-calendar
services:
  app:
    build: .
    image: org-calendar-custom:0.1
    restart: unless-stopped
    env_file: .env
    volumes:
      - data:/data
      - ./certs:/certs:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ['9443:443']
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro
    depends_on:
      app: {condition: service_healthy}
volumes:
  data:
